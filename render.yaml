services:
  - type: web
    name: financial-chart-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: NVIDIA_API_KEY
        # Set this in Render dashboard under "Environment" tab
      - key: PYTHONUNBUFFERED
        value: "1"